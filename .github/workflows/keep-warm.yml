# Keeps the free Render service awake during the evaluation window, so nobody
# opening the site meets a one-minute cold start. Render sleeps a free service
# after 15 minutes without traffic.
#
# GitHub can start scheduled runs several minutes late, so this pings every
# 5 minutes: a 10-minute schedule plus a delay could pass the 15-minute mark.
# Delete this file (or disable the workflow) after evaluation.
name: Keep warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        # Retries cover a wake-up already in progress; --max-time allows for a cold start.
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 https://firebreak-0y7c.onrender.com/api/health
